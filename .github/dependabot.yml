version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      build-tools:
        patterns: ['vite', '@vitejs/*', 'vitest']
  - package-ecosystem: pip
    directory: /apps/local-service
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
