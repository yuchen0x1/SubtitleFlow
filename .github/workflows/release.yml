name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: SubtitleFlow-release
          path: artifacts
      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          version="${TAG#v}"
          archive="SubtitleFlow-${version}-Chromium.zip"
          (cd artifacts && sha256sum --check SHA256SUMS)
          if gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx false; then
            echo "Published release already exists. Verifying published contents."
          else
            if gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx true; then
              echo "::error::A draft already exists for this tag. Review the draft asset list before resuming."
              exit 1
            fi
            awk -v title="## $version " '
              index($0, title) == 1 { found=1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > /tmp/subtitleflow-release-notes.md
            test -s /tmp/subtitleflow-release-notes.md
            gh release create "$TAG" "artifacts/$archive" artifacts/SHA256SUMS artifacts/release-metadata.json \
              --verify-tag --draft --title "SubtitleFlow $TAG" --notes-file /tmp/subtitleflow-release-notes.md
            gh release download "$TAG" --dir /tmp/subtitleflow-draft \
              --pattern "$archive" --pattern SHA256SUMS --pattern release-metadata.json
            for name in "$archive" SHA256SUMS release-metadata.json; do
              cmp "artifacts/$name" "/tmp/subtitleflow-draft/$name"
            done
            gh release edit "$TAG" --draft=false
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Release attestation did not become available in time."
              exit 1
            fi
            echo "Release attestation is not available yet; retrying in 10 seconds."
            sleep 10
          done
          for name in "$archive" SHA256SUMS release-metadata.json; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "/tmp/$name" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
            cmp "artifacts/$name" "/tmp/$name"
            gh release verify-asset "$TAG" "/tmp/$name"
          done
