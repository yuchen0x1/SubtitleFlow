name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/audit-npm.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: python -m compileall -q apps/local-service/app
      - run: npm run pack:dist
        env:
          RELEASE_TAG: ${{ inputs.release && github.ref_name || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: SubtitleFlow-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
